<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scott Analyzer - AI Prediction</title>
<style>
body{background:#0f1115;color:white;font-family:Arial;text-align:center;padding:15px}
select{width:100%;padding:12px;border-radius:10px;font-size:16px;background:#1a1d24;color:white;border:1px solid #333}
.tabs{display:flex;gap:5px;margin:15px 0;overflow-x:auto}
.tabs button{flex:1;padding:10px;border-radius:20px;border:none;background:#222;color:#aaa;font-weight:bold;min-width:60px}
.tabs button.active{background:#00c9a7;color:white}
.circle{width:180px;height:180px;border-radius:50%;background:#1e2a3a;border:5px solid #00c9a7;margin:20px auto;display:flex;flex-direction:column;justify-content:center}
.circle b{font-size:70px;color:#00c9a7}
.circle span{font-size:12px;color:#aaa}
.card{background:#1a1d24;padding:12px;border-radius:12px;margin:8px 0;text-align:left}
button.main{width:100%;padding:14px;background:#00c9a7;border:none;border-radius:12px;font-size:18px;font-weight:bold}
</style>
</head>
<body>
<h2>SCOTT ANALYZER 🤖</h2>
<p>AI Prediction Analyzer</p>

<!-- MARKET SELECT - NEW! -->
<label>VOLATILITY</label>
<select id="market" onchange="changeMarket()">
<option value="R_25">Volatility 25 (1s)</option>
<option value="R_75">Volatility 75 (1s)</option>
<option value="R_10">Volatility 10 (1s)</option>
<option value="R_50">Volatility 50 (1s)</option>
<option value="R_100">Volatility 100 (1s)</option>
</select>

<div class="tabs">
<button onclick="setType('matches',this)" class="active">Matches</button>
<button onclick="setType('differs',this)">Differs</button>
<button onclick="setType('even',this)">Even</button>
<button onclick="setType('odd',this)">Odd</button>
<button onclick="setType('over',this)">Over</button>
<button onclick="setType('under',this)">Under</button>
</div>

<div class="circle"><b id="aiDigit">-</b><span>AI PREDICTION</span></div>
<div id="aiText">Waiting for ticks...</div>

<div class="card" id="overBox"></div>
<div class="card" id="evenBox"></div>
<div class="card" id="matchBox"></div>

<button class="main" onclick="location.reload()">Analyze Digits</button>
<p id="price">Current Price: - | Last Digit: -</p>
<p id="dist"></p>

<script>
let type='matches';
let ticks=[];
let currentSymbol='R_25';
let ws;

function setType(t,btn){type=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');updateAI();}

function updateAI(){
 if(ticks.length<5) return;
 let counts=Array(10).fill(0);
 ticks.forEach(d=>counts[d]++);
 let maxDigit=counts.indexOf(Math.max(...counts));
 let minDigit=counts.indexOf(Math.min(...counts));
 let ai=maxDigit;
 if(type==='matches') ai=maxDigit;
 if(type==='differs') ai=minDigit;
 if(type==='even') ai=8;
 if(type==='odd') ai=7;
 if(type==='over') ai=1;
 if(type==='under') ai=8;
 document.getElementById('aiDigit').innerText=ai;
 document.getElementById('aiText').innerText = type.toUpperCase() + ' Prediction: ' + ai + ' | Market: ' + document.getElementById('market').options[document.getElementById('market').selectedIndex].text;
}

function connect(){
 if(ws) ws.close();
 ticks=[];
 ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
 ws.onopen=()=>{ws.send(JSON.stringify({ticks:currentSymbol}))};
 ws.onmessage=(e)=>{
  let data=JSON.parse(e.data);
  if(data.tick){
   let price=data.tick.quote; let digit=parseInt(String(price).slice(-1));
   ticks.push(digit); if(ticks.length>100) ticks.shift();
   document.getElementById('price').innerText='Current Price: '+price+' | Last Digit: '+digit;
   let counts=Array(10).fill(0); ticks.forEach(d=>counts[d]++);
   let over1=ticks.filter(d=>d>1).length;
   let even=ticks.filter(d=>d%2==0).length;
   document.getElementById('overBox').innerHTML='Over 1: '+over1+'% • Last digit '+digit+' - '+(digit>1?'WIN ✅':'LOSS ❌');
   document.getElementById('evenBox').innerHTML='Even: '+even+'% • Odd: '+(100-even)+'% • Last digit '+digit+' is '+(digit%2==0?'EVEN':'ODD');
   document.getElementById('matchBox').innerHTML='Matches 5: '+counts[5]+'% • Differs 5: '+(100-counts[5])+'% • Last digit '+digit+' - '+(digit==5?'MATCHES ✅':'DIFFERS ✅');
   document.getElementById('dist').innerHTML='DIGIT DISTRIBUTION - LAST 100 TICKS<br>'+counts.map((c,i)=>'Digit '+i+': '+c+'%').join(' | ');
   updateAI();
  }
 };
}
function changeMarket(){
 currentSymbol=document.getElementById('market').value;
 connect();
}
connect();
</script>
</body>
</html>
