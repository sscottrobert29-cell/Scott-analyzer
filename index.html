<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scott Analyzer</title>
<style>
body{background:#0f1115;color:white;font-family:Arial;text-align:center;padding:15px}
select{width:100%;padding:12px;border-radius:10px;font-size:16px;background:#1a1d24;color:white;border:1px solid #333}
.tabs{display:flex;gap:5px;margin:15px 0;overflow-x:auto}
.tabs button{flex:1;padding:10px;border-radius:20px;border:none;background:#222;color:#aaa;font-weight:bold;min-width:60px}
.tabs button.active{background:#00c9a7;color:white}
.circle{width:180px;height:180px;border:4px solid #00c9a7;border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;font-weight:bold}
.box{background:#1a1d24;padding:15px;border-radius:10px;margin:10px 0;text-align:left}
.btn{background:#00c9a7;color:white;border:none;padding:15px;width:100%;border-radius:10px;font-size:18px;font-weight:bold}
</style>
</head>
<body>
<h2>SCOTT ANALYZER 🤖</h2>
<p>AI Prediction Analyzer</p>
<p>VOLATILITY</p>
<select id="symbol">
<option value="R_25">Volatility 25 (1s)</option>
<option value="R_50">Volatility 50 (1s)</option>
<option value="R_75">Volatility 75 (1s)</option>
<option value="R_100">Volatility 100 (1s)</option>
<option value="R_10">Volatility 10 (1s)</option>
</select>
<div class="tabs">
<button class="active" onclick="setTab(this,'Matches')">Matches</button>
<button onclick="setTab(this,'Differs')">Differs</button>
<button onclick="setTab(this,'Even')">Even</button>
<button onclick="setTab(this,'Odd')">Odd</button>
<button onclick="setTab(this,'Over')">Over</button>
</div>
<div class="circle" id="pred">AI PREDICTION</div>
<p>Connecting...</p>
<p id="status" style="color:yellow;font-size:13px">Status: Starting...</p>
<div class="box" id="overBox">Over box waiting</div>
<div class="box" id="evenBox">Even box waiting</div>
<div class="box" id="matchBox">Match box waiting</div>
<button class="btn" onclick="analyze()">Analyze Digits</button>
<p id="last">Last Digit: - | Price: -</p>

<script>
let ws=null, digits=[], currentTab='Matches', tryIndex=0;
const servers=[
"wss://ws.derivws.com/websockets/v3?app_id=1089",
"wss://ws.deriv.com/websockets/v3?app_id=1089",
"wss://frontend.derivws.com/websockets/v3?app_id=1089"
];
function setTab(el,t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');currentTab=t;updateBoxes();}
function setStatus(t){document.getElementById('status').innerText="Status: "+t;}
function connect(){
  if(tryIndex>=servers.length){setStatus("All servers failed - Turn OFF VPN, use WiFi / MTN data, then refresh");setTimeout(()=>{tryIndex=0;connect();},5000);return;}
  let url=servers[tryIndex];
  setStatus("Trying server "+(tryIndex+1)+" / 3 ...");
  try{ws=new WebSocket(url);}catch(e){tryIndex++;connect();return;}
  ws.onopen=()=>{
    setStatus("✅ CONNECTED to Deriv - "+url);
    ws.send(JSON.stringify({ticks_history:document.getElementById('symbol').value, count:100, end:"latest", style:"ticks"}));
    ws.send(JSON.stringify({ticks:document.getElementById('symbol').value, subscribe:1}));
  };
  ws.onmessage=(e)=>{
    let d=JSON.parse(e.data);
    if(d.history&&d.history.prices){digits=d.history.prices.map(p=>{let s=p.toString();return parseInt(s[s.length-1]);});updateBoxes();}
    if(d.tick&&d.tick.quote){let q=d.tick.quote.toString();let last=parseInt(q[q.length-1]);digits.push(last);if(digits.length>100)digits.shift();document.getElementById('last').innerText="Last Digit: "+last+" | Price: "+q;updateBoxes();}
    if(d.error){setStatus("Deriv error: "+d.error.message);}
  };
  ws.onerror=()=>{setStatus("Server "+(tryIndex+1)+" failed, trying next...");};
  ws.onclose=()=>{tryIndex++;if(tryIndex<3){setTimeout(connect,1000);}else{setStatus("All failed - retrying in 5s...");setTimeout(()=>{tryIndex=0;connect();},5000);}};
}
document.getElementById('symbol').addEventListener('change',()=>{digits=[];tryIndex=0;if(ws)ws.close();connect();});
function updateBoxes(){
  if(digits.length==0)return;
  let last=digits[digits.length-1];
  let even=digits.filter(x=>x%2==0).length;
  let odd=digits.length-even;
  let over=digits.filter(x=>x>4).length;
  let match=0;for(let i=1;i<digits.length;i++)if(digits[i]==digits[i-1])match++;
  document.getElementById('evenBox').innerText="Even box: "+even+" / "+digits.length+" - Last: "+last+(last%2==0?" (EVEN)":" (ODD)");
  document.getElementById('overBox').innerText="Over box: "+over+" / "+digits.length+" - Last: "+last+(last>4?" (OVER 4)":" (UNDER 5)");
  document.getElementById('matchBox').innerText="Match box: "+match+" matches in last "+digits.length+" digits";
}
function analyze(){
  if(digits.length<10){alert("Wait for digits to load - still connecting");return;}
  let last=digits[digits.length-1];
  let even=digits.filter(x=>x%2==0).length;
  let txt="Last Digit: "+last+"\n";
  if(currentTab=='Even')txt+= (even>digits.length/2?"Prediction: EVEN - "+Math.round(even/digits.length*100)+"%":"Prediction: ODD");
  if(currentTab=='Over')txt+= (last>4?"Prediction: OVER":"Prediction: UNDER");
  if(currentTab=='Matches')txt+="Matches in history: Check pattern";
  document.getElementById('pred').innerText=txt;
  updateBoxes();
}
connect();
</script>
</body>
</html>
