<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRO CORTEX V7 FIXED</title><style>body{background:#04211d;color:#fff;font-family:sans-serif;padding:15px;text-align:center} .box{background:#0a322c;padding:15px;border-radius:15px;margin:10px 0} button{background:#00d8b0;color:#000;padding:15px;border:none;border-radius:25px;width:100%;font-weight:bold;font-size:18px} select,input{width:100%;padding:10px;margin:5px 0;border-radius:10px;background:#06322b;color:#fff;border:none} .circle{width:180px;height:180px;border:4px solid #00d8b0;border-radius:50%;margin:15px auto;display:flex;align-items:center;justify-content:center;font-size:50px}</style></head><body>
<h2>PRO CORTEX - V7 FIXED</h2><div class="box"><div id="price">Current Price: Connecting...</div><div id="digit">Last Digit: -</div><div id="pattern">Even/Odd: ----------</div></div>
<div class="box"><label>Market</label><select id="sym"><option value="1HZ75V">Volatility 75 (1s)</option><option value="R_75">Volatility 75</option><option value="R_100">Volatility 100 (1s) - 1HZ100V</option><option value="1HZ10V">Volatility 10 (1s)</option><option value="R_10">Volatility 10</option></select>
<button onclick="start()">Analyze Digits</button><br><br><input type="checkbox" id="auto"> Auto-refresh</div>
<div class="box"><div class="circle" id="pred">-</div><div id="msg">Waiting... Tap Analyze</div><br><button onclick="copyTxt()">COPY TO DERIV BOT</button><div id="copyTxt">Prediction = -</div></div>
<script>
let ws, ticks=[];
function start(){ let s=document.getElementById('sym').value; if(s.includes('100')) s='1HZ100V';
 if(ws) ws.close(); ticks=[];
 ws=new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');
 ws.onopen=()=>{ ws.send(JSON.stringify({ticks:s})); ws.send(JSON.stringify({ticks_history:s,count:20,end:'latest',style:'ticks'})); document.getElementById('price').innerText='Connecting to '+s+'...'; };
 ws.onmessage=(e)=>{ let d=JSON.parse(e.data); if(d.tick){ let p=d.tick.quote; update(p); } if(d.history){ d.history.prices.forEach(p=>update(p,true)); } if(d.error){ document.getElementById('price').innerText='Error: '+d.error.message; } };
}
function update(p,fromHist){ let str=p.toString(); let last=parseInt(str.slice(-1)); document.getElementById('price').innerText='Current Price: '+p; document.getElementById('digit').innerText='Last Digit: '+last;
 if(!fromHist){ ticks.push(last); if(ticks.length>10) ticks.shift(); } else { ticks.push(last); if(ticks.length>10) ticks.shift(); }
 let pat=ticks.map(n=>n%2==0?'E':'O').join(' '); document.getElementById('pattern').innerText='Even/Odd: '+pat;
 let ev=ticks.filter(n=>n%2==0).length; let pred = ev>=5 ? 'EVEN' : 'ODD'; document.getElementById('pred').innerText=pred[0]; document.getElementById('msg').innerText='Prediction: '+pred+' - Even '+ev+'/10'; document.getElementById('copyTxt').innerText='Prediction = '+pred;
}
function copyTxt(){ navigator.clipboard.writeText(document.getElementById('copyTxt').innerText); alert('Copied!'); }
setInterval(()=>{ if(document.getElementById('auto').checked) start(); },3000);
start();
</script></body></html>
